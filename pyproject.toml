[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-agent-workspace"
version = "0.1.0"
description = "An AI-managed job search workspace"
requires-python = ">=3.10"
dependencies = ["Flask==3.1.3", "waitress==3.0.2"]

[project.optional-dependencies]
mcp = ["mcp==1.26.0"]

[project.scripts]
job-agent = "job_agent.cli:main"
job-agent-mcp = "job_agent.mcp_server:main"
job-agent-web = "job_agent.web:main"

[tool.setuptools.packages.find]
include = ["job_agent*"]

[tool.setuptools.package-data]
job_agent = ["static/*"]
